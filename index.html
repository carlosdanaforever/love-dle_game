<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Love-dle ❤️</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #fdf2f8; /* pink-50 */
            touch-action: manipulation;
            overflow-x: hidden;
        }

        .tile {
            transition: transform 0.1s;
        }

        .tile.pop {
            animation: pop 0.1s ease-in-out;
        }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .tile.flip {
            animation: flip 0.5s ease-in-out forwards;
        }

        @keyframes flip {
            0% { transform: rotateX(0); }
            50% { transform: rotateX(-90deg); }
            100% { transform: rotateX(0); }
        }

        /* Prevent double-tap zoom on mobile */
        button {
            touch-action: manipulation;
        }

        /* Confetti Animation */
        .confetti-heart {
            position: absolute;
            font-size: 24px;
            animation: fall linear forwards;
            z-index: 100;
            pointer-events: none;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(360deg);
            }
        }
    </style>
</head>
<body class="flex flex-col min-h-screen text-slate-800 relative">

    <header class="flex flex-col sm:flex-row items-center justify-between w-full py-4 px-4 sm:px-8 border-b border-pink-200 bg-white shadow-sm gap-3">
        <div class="w-24 hidden sm:block"></div> <!-- Spacer for centering -->
        <h1 class="text-3xl font-extrabold tracking-wider text-pink-500 drop-shadow-sm flex items-center gap-2">
            LOVE-DLE <span class="text-2xl">❤️</span>
        </h1>
        
        <!-- Mode Toggle (Fixed symmetry bug) -->
        <div class="flex items-center justify-center gap-2 w-28">
            <span class="text-xs font-bold text-pink-500 transition-colors" id="mode-text-daily">DAILY</span>
            
            <label for="mode-toggle" class="flex items-center cursor-pointer">
                <div class="relative">
                    <input type="checkbox" id="mode-toggle" class="sr-only peer">
                    <!-- Track: 40px wide, 24px high -->
                    <div class="block w-10 h-6 bg-pink-200 rounded-full peer-checked:bg-pink-400 transition-colors duration-300"></div>
                    <!-- Thumb: 16x16px, starts 4px from left, moves 16px to right (4+16=20, leaves 4px on right) -->
                    <div class="absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition-transform duration-300 peer-checked:translate-x-4 shadow-sm"></div>
                </div>
            </label>

            <span class="text-xs font-bold text-slate-300 transition-colors" id="mode-text-endless">∞</span>
        </div>
    </header>

    <main class="flex-grow flex flex-col items-center justify-between w-full max-w-lg mx-auto py-6 px-4">
        
        <!-- Toast Notification Container -->
        <div id="toast-container" class="absolute top-24 left-0 right-0 flex flex-col items-center pointer-events-none z-50 gap-2"></div>

        <div id="board-container" class="flex items-center justify-center w-full flex-grow mb-6">
            <div id="board" class="grid grid-rows-6 gap-1.5 sm:gap-2 w-full max-w-[320px] aspect-[5/6]">
                <!-- JavaScript will populate the 30 tiles here -->
            </div>
        </div>

        <div id="keyboard" class="w-full max-w-[500px] flex flex-col gap-1.5 sm:gap-2 select-none pb-4">
            <div class="flex justify-center gap-1 sm:gap-1.5 w-full">
                <button data-key="Q" class="key flex-1 h-12 sm:h-14 font-bold rounded-lg bg-pink-100 hover:bg-pink-200 text-pink-900 transition-colors shadow-sm">Q</button>
                <button data-key="W" class="key flex-1 h-12 sm:h-14 font-bold rounded-lg bg-pink-100 hover:bg-pink-200 text-pink-900 transition-colors shadow-sm">W</button>
                <button data-key="E" class="key flex-1 h-12 sm:h-14 font-bold rounded-lg bg-pink-100 hover:bg-pink-200 text-pink-900 transition-colors shadow-sm">E</button>
                <button data-key="R" class="key flex-1 h-12 sm:h-14 font-bold rounded-lg bg-pink-100 hover:bg-pink-200 text-pink-900 transition-colors shadow-sm">R</button>
                <button data-key="T" class="key flex-1 h-12 sm:h-14 font-bold rounded-lg bg-pink-100 hover:bg-pink-200 text-pink-900 transition-colors shadow-sm">T</button>
                <button data-key="Y" class="key flex-1 h-12 sm:h-14 font-bold rounded-lg bg-pink-100 hover:bg-pink-200 text-pink-900 transition-colors shadow-sm">Y</button>
                <button data-key="U" class="key flex-1 h-12 sm:h-14 font-bold rounded-lg bg-pink-100 hover:bg-pink-200 text-pink-900 transition-colors shadow-sm">U</button>
                <button data-key="I" class="key flex-1 h-12 sm:h-14 font-bold rounded-lg bg-pink-100 hover:bg-pink-200 text-pink-900 transition-colors shadow-sm">I</button>
                <button data-key="O" class="key flex-1 h-12 sm:h-14 font-bold rounded-lg bg-pink-100 hover:bg-pink-200 text-pink-900 transition-colors shadow-sm">O</button>
                <button data-key="P" class="key flex-1 h-12 sm:h-14 font-bold rounded-lg bg-pink-100 hover:bg-pink-200 text-pink-900 transition-colors shadow-sm">P</button>
            </div>
            <div class="flex justify-center gap-1 sm:gap-1.5 w-full px-[5%]">
                <button data-key="A" class="key flex-1 h-12 sm:h-14 font-bold rounded-lg bg-pink-100 hover:bg-pink-200 text-pink-900 transition-colors shadow-sm">A</button>
                <button data-key="S" class="key flex-1 h-12 sm:h-14 font-bold rounded-lg bg-pink-100 hover:bg-pink-200 text-pink-900 transition-colors shadow-sm">S</button>
                <button data-key="D" class="key flex-1 h-12 sm:h-14 font-bold rounded-lg bg-pink-100 hover:bg-pink-200 text-pink-900 transition-colors shadow-sm">D</button>
                <button data-key="F" class="key flex-1 h-12 sm:h-14 font-bold rounded-lg bg-pink-100 hover:bg-pink-200 text-pink-900 transition-colors shadow-sm">F</button>
                <button data-key="G" class="key flex-1 h-12 sm:h-14 font-bold rounded-lg bg-pink-100 hover:bg-pink-200 text-pink-900 transition-colors shadow-sm">G</button>
                <button data-key="H" class="key flex-1 h-12 sm:h-14 font-bold rounded-lg bg-pink-100 hover:bg-pink-200 text-pink-900 transition-colors shadow-sm">H</button>
                <button data-key="J" class="key flex-1 h-12 sm:h-14 font-bold rounded-lg bg-pink-100 hover:bg-pink-200 text-pink-900 transition-colors shadow-sm">J</button>
                <button data-key="K" class="key flex-1 h-12 sm:h-14 font-bold rounded-lg bg-pink-100 hover:bg-pink-200 text-pink-900 transition-colors shadow-sm">K</button>
                <button data-key="L" class="key flex-1 h-12 sm:h-14 font-bold rounded-lg bg-pink-100 hover:bg-pink-200 text-pink-900 transition-colors shadow-sm">L</button>
            </div>
            <div class="flex justify-center gap-1 sm:gap-1.5 w-full">
                <button data-key="ENTER" class="key flex-[1.5] h-12 sm:h-14 text-[10px] sm:text-xs font-black rounded-lg bg-pink-200 hover:bg-pink-300 text-pink-900 transition-colors shadow-sm">ENTER</button>
                <button data-key="Z" class="key flex-1 h-12 sm:h-14 font-bold rounded-lg bg-pink-100 hover:bg-pink-200 text-pink-900 transition-colors shadow-sm">Z</button>
                <button data-key="X" class="key flex-1 h-12 sm:h-14 font-bold rounded-lg bg-pink-100 hover:bg-pink-200 text-pink-900 transition-colors shadow-sm">X</button>
                <button data-key="C" class="key flex-1 h-12 sm:h-14 font-bold rounded-lg bg-pink-100 hover:bg-pink-200 text-pink-900 transition-colors shadow-sm">C</button>
                <button data-key="V" class="key flex-1 h-12 sm:h-14 font-bold rounded-lg bg-pink-100 hover:bg-pink-200 text-pink-900 transition-colors shadow-sm">V</button>
                <button data-key="B" class="key flex-1 h-12 sm:h-14 font-bold rounded-lg bg-pink-100 hover:bg-pink-200 text-pink-900 transition-colors shadow-sm">B</button>
                <button data-key="N" class="key flex-1 h-12 sm:h-14 font-bold rounded-lg bg-pink-100 hover:bg-pink-200 text-pink-900 transition-colors shadow-sm">N</button>
                <button data-key="M" class="key flex-1 h-12 sm:h-14 font-bold rounded-lg bg-pink-100 hover:bg-pink-200 text-pink-900 transition-colors shadow-sm">M</button>
                <button data-key="BACKSPACE" class="key flex-[1.5] h-12 sm:h-14 flex items-center justify-center font-bold rounded-lg bg-pink-200 hover:bg-pink-300 text-pink-900 transition-colors shadow-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 sm:h-6 sm:w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M3 12l6.414 6.414a2 2 0 001.414.586H19a2 2 0 002-2V7a2 2 0 00-2-2h-8.172a2 2 0 00-1.414.586L3 12z" />
                    </svg>
                </button>
            </div>
        </div>
    </main>

    <div id="modal" class="fixed inset-0 bg-pink-900/60 backdrop-blur-sm hidden items-center justify-center z-50 transition-opacity opacity-0">
        <div class="bg-white p-8 rounded-3xl shadow-2xl max-w-sm w-[90%] text-center transform scale-95 transition-transform duration-300 border-4 border-pink-100 relative" id="modal-content">
            <!-- The important close 'X' button to back out of prompt -->
            <button id="modal-close" class="absolute top-3 right-3 text-pink-300 hover:text-pink-600 transition-colors p-1 rounded-full hover:bg-pink-50" aria-label="Close">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
            <h2 id="modal-title" class="text-3xl font-extrabold mb-3"></h2>
            <p id="modal-message" class="text-lg text-slate-700 mb-2 font-medium"></p>
            <p id="modal-submessage" class="text-md text-pink-600 mb-6 font-semibold italic hidden"></p>
            
            <div id="modal-buttons" class="flex flex-col gap-3">
                <!-- Buttons injected via JS based on mode -->
            </div>
        </div>
    </div>

    <script>
        // Romantic word list (strictly 5 letters)
        const WORDS = [
            "HEART", "SWEET", "SMILE", "HONEY", "BERRY", 
            "FLIRT", "STARS", "SNOWY", "LOVER", "ADORE",
            "BLISS", "CUTIE", "SUNNY", "TULIP", "LOYAL", 
            "LOVED", "ANGEL", "BRAVE", "SMART", "HAPPY", 
            "LUCKY", "PEACE", "BEAUT", "FAITH", "MARRY"
        ];

        const winMessages = [
            "You got it, beautiful! 💕",
            "You're so smart! 😻",
            "My smart cookie! 🍪❤️",
            "Perfect, just like you! ✨",
            "You're stunning baby! 💖"
        ];

        // DOM Elements
        const board = document.getElementById('board');
        const keyboard = document.getElementById('keyboard');
        const modal = document.getElementById('modal');
        const modalContent = document.getElementById('modal-content');
        const modalTitle = document.getElementById('modal-title');
        const modalMessage = document.getElementById('modal-message');
        const modalSubmessage = document.getElementById('modal-submessage');
        const modalButtons = document.getElementById('modal-buttons');
        const modalClose = document.getElementById('modal-close');
        const toastContainer = document.getElementById('toast-container');
        const modeToggle = document.getElementById('mode-toggle');
        const modeTextDaily = document.getElementById('mode-text-daily');
        const modeTextEndless = document.getElementById('mode-text-endless');

        const ROWS = 6;
        const COLS = 5;

        // Game State
        let isDailyMode = true; // Automatically start in daily mode
        let targetWord = "";
        let currentRow = 0;
        let currentCol = 0;
        let gameOver = false;
        let grid = [];
        let keyColors = {};

        function getDailyWord() {
            // Create a seed based on the current date string
            const dateStr = new Date().toDateString();
            let hash = 0;
            for (let i = 0; i < dateStr.length; i++) {
                hash = (hash << 5) - hash + dateStr.charCodeAt(i);
                hash |= 0; 
            }
            // Ensure positive index
            const index = Math.abs(hash) % WORDS.length;
            return WORDS[index];
        }

        function initGame(forceDaily = false) {
            if (forceDaily) {
                isDailyMode = true;
                modeToggle.checked = false;
            }

            // Update UI toggles
            if (isDailyMode) {
                modeTextDaily.classList.replace('text-slate-300', 'text-pink-500');
                modeTextEndless.classList.replace('text-pink-500', 'text-slate-300');
                targetWord = getDailyWord();
            } else {
                modeTextDaily.classList.replace('text-pink-500', 'text-slate-300');
                modeTextEndless.classList.replace('text-slate-300', 'text-pink-500');
                targetWord = WORDS[Math.floor(Math.random() * WORDS.length)];
            }

            // Reset state
            currentRow = 0;
            currentCol = 0;
            gameOver = false;
            grid = Array(ROWS).fill().map(() => Array(COLS).fill(''));
            keyColors = {};

            // Clear board UI
            board.innerHTML = '';
            board.style.gridTemplateColumns = `repeat(${COLS}, minmax(0, 1fr))`;

            // Create grid tiles
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const tile = document.createElement('div');
                    tile.id = `tile-${r}-${c}`;
                    tile.className = 'tile w-full h-full border-2 border-pink-200 bg-white flex items-center justify-center text-3xl sm:text-4xl font-extrabold uppercase rounded-xl text-slate-700 shadow-sm';
                    board.appendChild(tile);
                }
            }

            // Reset keyboard UI
            document.querySelectorAll('.key').forEach(keyEl => {
                keyEl.className = keyEl.className.replace(/bg-emerald-400|bg-amber-400|bg-slate-400|text-white|hover:bg-emerald-500|hover:bg-amber-500|hover:bg-slate-500/g, '');
                keyEl.classList.remove('text-white');
                if (keyEl.dataset.key === 'ENTER' || keyEl.dataset.key === 'BACKSPACE') {
                    keyEl.classList.add('bg-pink-200', 'text-pink-900', 'hover:bg-pink-300');
                } else {
                    keyEl.classList.add('bg-pink-100', 'text-pink-900', 'hover:bg-pink-200');
                }
            });

            hideModal();
        }

        function handleKeyClick(key) {
            if (gameOver) return;

            if (key === 'BACKSPACE') {
                if (currentCol > 0) {
                    currentCol--;
                    grid[currentRow][currentCol] = '';
                    updateTileUI(currentRow, currentCol, '');
                }
                return;
            }

            if (key === 'ENTER') {
                if (currentCol === COLS) {
                    submitGuess();
                } else {
                    showToast('Not enough letters!');
                }
                return;
            }

            if (/^[A-Z]$/.test(key)) {
                if (currentCol < COLS) {
                    grid[currentRow][currentCol] = key;
                    updateTileUI(currentRow, currentCol, key);
                    currentCol++;
                }
            }
        }

        function updateTileUI(row, col, letter) {
            const tile = document.getElementById(`tile-${row}-${col}`);
            tile.textContent = letter;
            if (letter) {
                tile.classList.add('border-pink-400', 'pop');
                setTimeout(() => tile.classList.remove('pop'), 100);
            } else {
                tile.classList.remove('border-pink-400');
            }
        }

        function submitGuess() {
            const guessArray = [...grid[currentRow]];
            const guess = guessArray.join('');
            
            const targetWordArr = targetWord.split('');
            const result = Array(COLS).fill('absent'); 

            // Pass 1: Find Exact Matches (Greens)
            for (let i = 0; i < COLS; i++) {
                if (guessArray[i] === targetWordArr[i]) {
                    result[i] = 'correct';
                    targetWordArr[i] = null; 
                }
            }

            // Pass 2: Find Partial Matches (Yellows)
            for (let i = 0; i < COLS; i++) {
                if (result[i] !== 'correct' && targetWordArr.includes(guessArray[i])) {
                    result[i] = 'present';
                    targetWordArr[targetWordArr.indexOf(guessArray[i])] = null; 
                }
            }

            animateRow(guessArray, result, guess);
        }

        function animateRow(guessArray, result, guess) {
            gameOver = true; 
            
            let delay = 0;
            const animationDuration = 500;
            const stagger = 250;

            for (let i = 0; i < COLS; i++) {
                const tile = document.getElementById(`tile-${currentRow}-${i}`);
                const letter = guessArray[i];
                const status = result[i];

                setTimeout(() => {
                    tile.classList.add('flip');
                    
                    // Change color halfway through flip
                    setTimeout(() => {
                        tile.classList.remove('border-pink-400', 'border-pink-200', 'bg-white', 'text-slate-700', 'shadow-sm');
                        tile.classList.add('text-white', 'border-none', 'shadow-md');
                        
                        if (status === 'correct') {
                            tile.classList.add('bg-emerald-400');
                            updateKeyColor(letter, 'correct');
                        } else if (status === 'present') {
                            tile.classList.add('bg-amber-400');
                            updateKeyColor(letter, 'present');
                        } else {
                            tile.classList.add('bg-slate-400');
                            updateKeyColor(letter, 'absent');
                        }
                    }, animationDuration / 2);

                    setTimeout(() => {
                        tile.classList.remove('flip');
                    }, animationDuration);

                }, delay);
                delay += stagger;
            }

            // Wait for animations to finish
            setTimeout(() => {
                checkWinLoss(guess);
            }, delay + animationDuration / 2);
        }

        function updateKeyColor(letter, status) {
            const currentStatus = keyColors[letter];
            
            if (currentStatus === 'correct') return; 
            if (currentStatus === 'present' && status === 'absent') return; 

            keyColors[letter] = status;
            
            const keyEl = document.querySelector(`.key[data-key="${letter}"]`);
            if (keyEl) {
                keyEl.className = keyEl.className.replace(/bg-pink-100|bg-pink-200|text-pink-900|hover:bg-pink-200|hover:bg-pink-300|bg-emerald-400|bg-amber-400|bg-slate-400|text-white|hover:bg-emerald-500|hover:bg-amber-500|hover:bg-slate-500/g, '');
                
                keyEl.classList.add('text-white');
                if (status === 'correct') {
                    keyEl.classList.add('bg-emerald-400', 'hover:bg-emerald-500');
                } else if (status === 'present') {
                    keyEl.classList.add('bg-amber-400', 'hover:bg-amber-500');
                } else {
                    keyEl.classList.add('bg-slate-400', 'hover:bg-slate-500');
                }
            }
        }

        function checkWinLoss(guess) {
            if (guess === targetWord) {
                triggerConfetti();
                setTimeout(() => showEndGame(true), 800);
            } else if (currentRow === ROWS - 1) {
                setTimeout(() => showEndGame(false), 500);
            } else {
                currentRow++;
                currentCol = 0;
                gameOver = false; 
            }
        }

        function triggerConfetti() {
            const colors = ['#ec4899', '#f472b6', '#fb7185', '#fda4af'];
            for (let i = 0; i < 40; i++) {
                const heart = document.createElement('div');
                heart.innerHTML = '❤️';
                heart.className = 'confetti-heart';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = (Math.random() * 2 + 2) + 's';
                heart.style.fontSize = (Math.random() * 15 + 15) + 'px';
                heart.style.filter = `drop-shadow(0 0 5px ${colors[Math.floor(Math.random() * colors.length)]})`;
                document.body.appendChild(heart);
                
                setTimeout(() => heart.remove(), 4000);
            }
        }

        function showEndGame(isWin) {
            modalButtons.innerHTML = ''; // Clear old buttons
            modalSubmessage.classList.add('hidden');

            // Setup Titles and Message
            if (isWin) {
                modalTitle.textContent = "You Won Baby! 🎉";
                modalTitle.className = "text-3xl font-extrabold mb-3 text-emerald-500";
                modalMessage.innerHTML = winMessages[Math.floor(Math.random() * winMessages.length)];
            } else {
                modalTitle.textContent = "Aww, almost baby! 💔";
                modalTitle.className = "text-3xl font-extrabold mb-3 text-pink-500";
                modalMessage.innerHTML = `The word was <strong class="text-xl text-pink-600">${targetWord}</strong>.`;
                modalSubmessage.innerHTML = "You're still my smart baby! 💖";
                modalSubmessage.classList.remove('hidden');
            }

            // Custom Prompt based on Daily vs Endless Mode
            if (isDailyMode) {
                const promptText = document.createElement('p');
                promptText.className = "text-md text-slate-600 mb-5 font-semibold bg-pink-50 p-3 rounded-lg border border-pink-100";
                promptText.textContent = "You've finished today's puzzle! Would you like to switch to Endless Mode to keep playing?";
                modalButtons.appendChild(promptText);

                const switchBtn = document.createElement('button');
                switchBtn.className = "w-full py-3.5 bg-pink-500 hover:bg-pink-600 text-white font-bold rounded-xl transition-colors shadow-lg hover:shadow-xl active:scale-95 text-lg";
                switchBtn.innerHTML = "Switch to Endless Mode ∞";
                switchBtn.onclick = () => {
                    modeToggle.checked = true;
                    isDailyMode = false;
                    initGame();
                };
                modalButtons.appendChild(switchBtn);

            } else {
                // Endless Mode Buttons
                const playAgainBtn = document.createElement('button');
                playAgainBtn.className = "w-full py-3.5 bg-pink-500 hover:bg-pink-600 text-white font-bold rounded-xl transition-colors shadow-lg hover:shadow-xl active:scale-95 text-lg mt-2";
                playAgainBtn.innerHTML = "Play Again ❤️";
                playAgainBtn.onclick = () => initGame();
                modalButtons.appendChild(playAgainBtn);
            }

            // Show Modal
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            setTimeout(() => {
                modal.classList.add('opacity-100');
                modalContent.classList.remove('scale-95');
                modalContent.classList.add('scale-100');
            }, 10);
        }

        function hideModal() {
            modal.classList.remove('opacity-100');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }, 300);
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'bg-slate-800/90 text-white px-5 py-3 rounded-full font-bold shadow-xl transition-all duration-300 opacity-0 transform translate-y-[-10px] backdrop-blur-sm';
            toast.textContent = message;
            
            toastContainer.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.remove('opacity-0', 'translate-y-[-10px]');
                toast.classList.add('opacity-100', 'translate-y-0');
            }, 10);
            
            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-[-10px]');
                setTimeout(() => toast.remove(), 300);
            }, 2000);
        }

        // Event Listeners
        document.querySelectorAll('.key').forEach(button => {
            button.addEventListener('click', () => {
                handleKeyClick(button.dataset.key);
                button.blur(); 
            });
        });

        window.addEventListener('keydown', (e) => {
            if (e.ctrlKey || e.metaKey || e.altKey || modal.classList.contains('flex')) return;
            
            const key = e.key.toUpperCase();
            if (key === 'ENTER' || key === 'BACKSPACE') {
                e.preventDefault(); 
                handleKeyClick(key);
            } else if (/^[A-Z]$/.test(key)) {
                handleKeyClick(key);
            }
        });

        modeToggle.addEventListener('change', (e) => {
            isDailyMode = !e.target.checked;
            showToast(isDailyMode ? "Switched to Daily Mode" : "Switched to Endless Mode");
            initGame();
        });

        // The "X" button correctly hides the modal to view the board!
        modalClose.addEventListener('click', hideModal);

        // Start the game on load (forcing daily mode as requested)
        window.onload = () => initGame(true);
    </script>
</body>
</html>
